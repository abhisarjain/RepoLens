spring:
  application:
    name: repolens-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/repolens}
    username: ${DB_USERNAME:repolens}
    password: ${DB_PASSWORD:repolens}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:6MB}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

repolens:
  upload:
    max-size: ${MAX_FILE_SIZE:5MB}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
